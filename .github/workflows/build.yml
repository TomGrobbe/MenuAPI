name: CI

# Builds all three packages from this one branch and publishes them to nuget.org as pre-releases.
# Never tags and never creates a GitHub release. The file keeps the name build.yml on purpose:
# nuget.org trusted publishing is tied to the workflow file name.

on:
  push:
    branches:
      - concept
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # The version every pre-release counts up to. Bump these by hand until real releases come back.
  ENHANCED_BASE: 2.0.0
  LEGACY_BASE: 4.0.0
  REDM_BASE: 3.3.0

jobs:
  build:
    name: Build
    runs-on: windows-latest

    outputs:
      enhanced: ${{ steps.version.outputs.enhanced }}
      legacy: ${{ steps.version.outputs.legacy }}
      redm: ${{ steps.version.outputs.redm }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dotted <label>.<run> so NuGet compares the run number as a number, run-123 would sort below run-57.
      - name: Set versions
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            LABEL="pr${PR_NUMBER}"
          else
            LABEL=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g')
          fi
          SUFFIX="${LABEL}.${{ github.run_number }}"
          {
            echo "enhanced=$ENHANCED_BASE-$SUFFIX"
            echo "legacy=$LEGACY_BASE-$SUFFIX"
            echo "redm=$REDM_BASE-$SUFFIX"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Pre-release versions"
            echo ""
            echo "| Package | Version |"
            echo "| --- | --- |"
            echo "| MenuAPI.FiveM.Enhanced | \`$ENHANCED_BASE-$SUFFIX\` |"
            echo "| MenuAPI.FiveM | \`$LEGACY_BASE-$SUFFIX\` |"
            echo "| MenuAPI.RedM | \`$REDM_BASE-$SUFFIX\` |"
            echo ""
            echo "Nothing is tagged or released."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web build tooling
        shell: bash
        run: npm ci

      # Everything, both frameworks and the TestMenu, so a break anywhere fails the run.
      - name: Build FiveM solution
        shell: bash
        run: dotnet build MenuAPI.FiveM.slnx -c Release

      - name: Build RedM solution
        shell: bash
        run: dotnet build redm/MenuAPI.RedM.slnx -c Release

      # Packing builds again, once per package, so each one gets its own version stamped in.
      - name: Pack Enhanced
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.enhanced }}"
          dotnet pack MenuAPI/MenuAPI.csproj -c Release -p:MenuApiFlavor=Enhanced \
            -p:Version="$VERSION" -p:AssemblyVersion="$ENHANCED_BASE" -p:FileVersion="$ENHANCED_BASE" \
            -o nupkgs

      - name: Zip Enhanced
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zips | Out-Null
          $outDir = 'MenuAPI/bin/Release/net10.0'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "zips/MenuAPI-${{ steps.version.outputs.enhanced }}-FiveM-Enhanced.zip" -Force

      - name: Pack Legacy
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.legacy }}"
          dotnet pack MenuAPI/MenuAPI.csproj -c Release -p:MenuApiFlavor=Legacy \
            -p:Version="$VERSION" -p:AssemblyVersion="$LEGACY_BASE" -p:FileVersion="$LEGACY_BASE" \
            -o nupkgs

      - name: Zip Legacy
        shell: pwsh
        run: |
          $outDir = 'MenuAPI/bin/Release/net452'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "zips/MenuAPI-${{ steps.version.outputs.legacy }}-FiveM.zip" -Force

      - name: Pack RedM
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.redm }}"
          dotnet pack redm/MenuAPI/MenuAPI.csproj -c Release \
            -p:Version="$VERSION" -p:AssemblyVersion="$REDM_BASE" -p:FileVersion="$REDM_BASE" \
            -o nupkgs

      - name: Zip RedM
        shell: pwsh
        run: |
          $outDir = 'redm/MenuAPI/bin/Release/net452'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "zips/MenuAPI-${{ steps.version.outputs.redm }}-RedM.zip" -Force

      # Profiling build, slower than the normal one, so it only ships as a workflow artifact and never to nuget.org.
      - name: Pack NativeHooks
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.enhanced }}"
          dotnet pack MenuAPI/MenuAPI.csproj -c NativeHooks \
            -p:Version="$VERSION" -p:AssemblyVersion="$ENHANCED_BASE" -p:FileVersion="$ENHANCED_BASE" \
            -o nupkgs-nativehooks

      - name: Zip NativeHooks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zips | Out-Null
          Compress-Archive -Path 'nupkgs-nativehooks/*.nupkg' -DestinationPath "zips/MenuAPI-${{ steps.version.outputs.enhanced }}-NativeHooks-NuGet.zip" -Force

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nupkgs/*.nupkg

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: zips
          path: zips/*.zip

  # Pushes only. Pull requests and dependabot runs have no business publishing, and cannot get an id-token anyway.
  publish:
    name: Publish pre-release NuGet packages
    needs: build
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        shell: bash
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
