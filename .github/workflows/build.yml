name: CI/CD

# This exact file sits on both legacy and fivem-enhanced. Keep the two copies identical.
# A push to either branch builds both lines into one release attached to the Enhanced tag.
# A line only gets a new version when it has new commits, otherwise it is rebuilt from its latest tag.
# Side branches and pull requests are handled by dev-legacy.yml and dev-enhanced.yml.

on:
  push:
    branches:
      - legacy
      - fivem-enhanced
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Push filters never fire on an empty commit, this is the way to release without a code change.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time across both branches, never cancelled halfway. GitHub does drop a queued run when
# a newer one queues behind it, which is why the plan job also picks up commits that never got a run.
concurrency:
  group: combined-release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/legacy' || github.ref == 'refs/heads/fivem-enhanced'
    runs-on: ubuntu-latest

    outputs:
      release:              ${{ steps.plan.outputs.release }}
      legacy_moved:         ${{ steps.plan.outputs.legacy_moved }}
      enhanced_moved:       ${{ steps.plan.outputs.enhanced_moved }}
      legacy_ref:           ${{ steps.plan.outputs.legacy_ref }}
      enhanced_ref:         ${{ steps.plan.outputs.enhanced_ref }}
      legacy_version:       ${{ steps.plan.outputs.legacy_version }}
      enhanced_version:     ${{ steps.plan.outputs.enhanced_version }}
      legacy_assembly_ver:  ${{ steps.plan.outputs.legacy_assembly_ver }}
      enhanced_assembly_ver: ${{ steps.plan.outputs.enhanced_assembly_ver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      # The pushed line is pinned to its sha, so a push landing mid run cannot move it.
      # The other line also moves when it has commits since its tag that never got a run of their own,
      # which happens when GitHub drops a queued run because a newer one queued behind it.
      - name: Find the lines with unreleased changes
        id: candidates
        working-directory: repo
        shell: bash
        run: |
          git fetch origin --tags --prune "+refs/heads/*:refs/remotes/origin/*"

          releasable_commit() {
            local sha="$1" files
            if git log -1 --format=%B "$sha" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|^skip-checks: *true'; then
              return 1
            fi
            if git rev-parse -q --verify "$sha^1" >/dev/null; then
              files=$(git diff --name-only "$sha^1" "$sha")
            else
              files=$(git show --name-only --format= "$sha")
            fi
            printf '%s\n' "$files" | grep -vE '^(docs/|\.github/workflows/docs\.yml$)' | grep -q .
          }

          candidate() {
            local line="$1" branch="$2" glob="$3"
            local tag ref sha moved=false

            tag=$(git describe --tags --abbrev=0 --match "$glob" "origin/$branch" 2>/dev/null || true)

            if [ "$GITHUB_REF" = "refs/heads/$branch" ]; then
              ref="$GITHUB_SHA"
              moved=true
            else
              ref=$(git rev-parse "origin/$branch")
              if [ -z "$tag" ]; then
                moved=true
              else
                for sha in $(git rev-list --first-parent "$tag..$ref"); do
                  if releasable_commit "$sha"; then
                    echo "$line has unreleased commit $(git log -1 --format='%h %s' "$sha")"
                    moved=true
                    break
                  fi
                done
              fi
            fi

            echo "$line: tag=${tag:-<none>} ref=$ref candidate=$moved"
            {
              echo "${line}_tag=$tag"
              echo "${line}_ref=$ref"
              echo "${line}_moved=$moved"
            } >> "$GITHUB_OUTPUT"
          }

          candidate legacy   legacy   'v[0-9]*'
          candidate enhanced fivem-enhanced 'enhanced-v[0-9]*'

      # Always the previous tag plus one, never a count of commits, so a release never skips a number.
      # A +semver: major or +semver: minor in any commit since the tag bumps that part instead. When every
      # commit since the tag says +semver: none, the line counts as unchanged and is rebuilt from its tag.
      - name: Settle versions
        id: plan
        working-directory: repo
        shell: bash
        env:
          LEGACY_MOVED:   ${{ steps.candidates.outputs.legacy_moved }}
          LEGACY_REF:     ${{ steps.candidates.outputs.legacy_ref }}
          ENHANCED_MOVED: ${{ steps.candidates.outputs.enhanced_moved }}
          ENHANCED_REF:   ${{ steps.candidates.outputs.enhanced_ref }}
        run: |
          RELEASE=false

          bump_for() {
            local range="$1" messages sha
            messages=$(git log --format=%B "$range")
            if grep -qiE '\+semver:[[:space:]]*(breaking|major)' <<< "$messages"; then
              echo major
              return
            fi
            if grep -qiE '\+semver:[[:space:]]*(feature|minor)' <<< "$messages"; then
              echo minor
              return
            fi
            for sha in $(git rev-list "$range"); do
              if ! git log -1 --format=%B "$sha" | grep -qiE '\+semver:[[:space:]]*(none|skip)'; then
                echo patch
                return
              fi
            done
            echo none
          }

          # A pre-release tag like 0.0.1-alpha.5 is followed by its own release, 0.0.1, on a patch.
          next_version() {
            local base="$1" bump="$2" core major minor patch
            core="${base%%-*}"
            IFS=. read -r major minor patch <<< "$core"
            case "$bump" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              *)
                if [ "$core" != "$base" ]; then
                  echo "$core"
                else
                  echo "$major.$minor.$((patch + 1))"
                fi
                ;;
            esac
          }

          settle() {
            local line="$1" title="$2" prefix="$3" moved="$4" ref="$5"
            local tag bump version state

            tag=$(git describe --tags --abbrev=0 --match "${prefix}[0-9]*" "$ref" 2>/dev/null || true)

            if [ "$moved" = "true" ]; then
              if [ -n "$tag" ]; then
                bump=$(bump_for "$tag..$ref")
                version=$(next_version "${tag#"$prefix"}" "$bump")
              else
                bump=$(bump_for "$ref")
                version=$(next_version "0.0.0" "$bump")
              fi

              if [ "$bump" = "none" ] && [ -n "$tag" ]; then
                echo "$line: nothing since $tag needs a new version."
                moved=false
              elif git rev-parse -q --verify "refs/tags/$prefix$version" >/dev/null; then
                echo "::error::$line: the next version $prefix$version is already tagged, but $tag is the newest tag on this line."
                exit 1
              fi
            fi

            if [ "$moved" = "true" ]; then
              RELEASE=true
              state="new, $bump bump from ${tag:-nothing}"
            else
              ref="$tag"
              version="${tag#"$prefix"}"
              state="unchanged, rebuilt from its tag"
            fi

            local assembly="${version%%-*}"

            echo "$line: moved=$moved ref=$ref version=$version"
            {
              echo "${line}_moved=$moved"
              echo "${line}_ref=$ref"
              echo "${line}_version=$version"
              echo "${line}_assembly_ver=$assembly"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## $title"
              echo ""
              echo "| | |"
              echo "| --- | --- |"
              echo "| Version | \`${version}\` (${state}) |"
              echo "| Assembly version | \`${assembly}\` |"
              echo "| Tag | \`${prefix}${version}\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }

          settle legacy   "MenuAPI Legacy"   'v'          "$LEGACY_MOVED"   "$LEGACY_REF"
          settle enhanced "MenuAPI Enhanced" 'enhanced-v' "$ENHANCED_MOVED" "$ENHANCED_REF"

          if [ "$RELEASE" = "false" ]; then
            echo "Nothing new to release on either line." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  # FiveM and RedM restore separately, the CitizenFX NuGet package conflicts with the local RedM dll.
  build-legacy-fivem:
    name: Build Legacy FiveM
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.legacy_ref }}
          fetch-depth: 0

      - name: Restore NuGet (FiveM only)
        shell: bash
        run: dotnet restore "MenuAPI/MenuAPI.csproj" "-p:Configuration=Release FiveM"

      - name: Build FiveM
        shell: bash
        run: |
          dotnet build MenuAPI/MenuAPI.csproj -c "Release FiveM" --no-restore \
            -p:Version=${{ needs.plan.outputs.legacy_version }} \
            -p:AssemblyVersion=${{ needs.plan.outputs.legacy_assembly_ver }} \
            -p:FileVersion=${{ needs.plan.outputs.legacy_assembly_ver }}

      - name: Package FiveM zip
        shell: pwsh
        run: |
          $outDir = 'MenuAPI/bin/Release FiveM/net452'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "MenuAPI-${{ needs.plan.outputs.legacy_version }}-FiveM.zip" -Force

      - name: Upload FiveM zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-legacy-fivem
          path: MenuAPI-${{ needs.plan.outputs.legacy_version }}-FiveM.zip

      - name: Pack NuGet FiveM
        run: >-
          dotnet pack MenuAPI/MenuAPI.csproj
          -c "Release FiveM"
          --no-restore
          -p:PackageVersion=${{ needs.plan.outputs.legacy_version }}
          -p:DefineConstants=FIVEM
          -p:PackageId=MenuAPI.FiveM
          -o nupkgs

      - name: Upload NuGet FiveM
        uses: actions/upload-artifact@v4
        with:
          name: nuget-legacy-fivem
          path: nupkgs/*.nupkg

  build-legacy-redm:
    name: Build Legacy RedM
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.legacy_ref }}
          fetch-depth: 0

      - name: Restore NuGet (RedM only)
        shell: bash
        run: dotnet restore "MenuAPI/MenuAPI.csproj" "-p:Configuration=Release RedM"

      - name: Build RedM
        shell: bash
        run: |
          dotnet build MenuAPI/MenuAPI.csproj -c "Release RedM" --no-restore \
            -p:Version=${{ needs.plan.outputs.legacy_version }} \
            -p:AssemblyVersion=${{ needs.plan.outputs.legacy_assembly_ver }} \
            -p:FileVersion=${{ needs.plan.outputs.legacy_assembly_ver }}

      - name: Package RedM zip
        shell: pwsh
        run: |
          $outDir = 'MenuAPI/bin/Release RedM/net452'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "MenuAPI-${{ needs.plan.outputs.legacy_version }}-RedM.zip" -Force

      - name: Upload RedM zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-legacy-redm
          path: MenuAPI-${{ needs.plan.outputs.legacy_version }}-RedM.zip

      - name: Pack NuGet RedM
        run: >-
          dotnet pack MenuAPI/MenuAPI.csproj
          -c "Release RedM"
          --no-restore
          -p:PackageVersion=${{ needs.plan.outputs.legacy_version }}
          -p:DefineConstants=REDM
          -p:PackageId=MenuAPI.RedM
          -o nupkgs

      - name: Upload NuGet RedM
        uses: actions/upload-artifact@v4
        with:
          name: nuget-legacy-redm
          path: nupkgs/*.nupkg

  build-enhanced:
    name: Build Enhanced
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.enhanced_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web build tooling
        shell: bash
        run: npm ci

      - name: Restore NuGet (FiveM only)
        shell: bash
        run: dotnet restore "MenuAPI/MenuAPI.csproj" -p:Configuration=Release

      - name: Build FiveM
        shell: bash
        run: |
          dotnet build MenuAPI/MenuAPI.csproj -c Release --no-restore \
            -p:Version=${{ needs.plan.outputs.enhanced_version }} \
            -p:AssemblyVersion=${{ needs.plan.outputs.enhanced_assembly_ver }} \
            -p:FileVersion=${{ needs.plan.outputs.enhanced_assembly_ver }}

      - name: Package FiveM zip
        shell: pwsh
        run: |
          $outDir = 'MenuAPI/bin/Release/net10.0'
          Copy-Item README.md "$outDir/README.md" -Force
          Compress-Archive -Path "$outDir/*" -DestinationPath "MenuAPI-${{ needs.plan.outputs.enhanced_version }}-FiveM-Enhanced.zip" -Force

      - name: Upload FiveM zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-enhanced
          path: MenuAPI-${{ needs.plan.outputs.enhanced_version }}-FiveM-Enhanced.zip

      - name: Pack NuGet FiveM
        run: >-
          dotnet pack MenuAPI/MenuAPI.csproj
          -c Release
          --no-restore
          -p:PackageVersion=${{ needs.plan.outputs.enhanced_version }}
          -o nupkgs

      - name: Upload NuGet FiveM
        uses: actions/upload-artifact@v4
        with:
          name: nuget-enhanced
          path: nupkgs/*.nupkg

      # Profiling build, slower than the normal one, so it only ships inside a zip and never to nuget.org.
      - name: Restore NuGet (NativeHooks)
        shell: bash
        run: dotnet restore "MenuAPI/MenuAPI.csproj" -p:Configuration=NativeHooks

      - name: Pack NuGet NativeHooks
        shell: bash
        run: |
          dotnet pack MenuAPI/MenuAPI.csproj -c NativeHooks --no-restore \
            -p:PackageVersion=${{ needs.plan.outputs.enhanced_version }} \
            -p:Version=${{ needs.plan.outputs.enhanced_version }} \
            -p:AssemblyVersion=${{ needs.plan.outputs.enhanced_assembly_ver }} \
            -p:FileVersion=${{ needs.plan.outputs.enhanced_assembly_ver }} \
            -o nupkgs-nativehooks

      - name: Package NativeHooks zip
        shell: pwsh
        run: Compress-Archive -Path 'nupkgs-nativehooks/*.nupkg' -DestinationPath "MenuAPI-${{ needs.plan.outputs.enhanced_version }}-NativeHooks-NuGet.zip" -Force

      - name: Upload NativeHooks zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-enhanced-nativehooks
          path: MenuAPI-${{ needs.plan.outputs.enhanced_version }}-NativeHooks-NuGet.zip

  release:
    name: Release
    needs: [plan, build-legacy-fivem, build-legacy-redm, build-enhanced]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release_url: ${{ steps.release.outputs.release_url }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LEGACY_VERSION: ${{ needs.plan.outputs.legacy_version }}
      ENHANCED_VERSION: ${{ needs.plan.outputs.enhanced_version }}
      LEGACY_REF: ${{ needs.plan.outputs.legacy_ref }}
      ENHANCED_REF: ${{ needs.plan.outputs.enhanced_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch both branches and all tags
        run: git fetch origin --tags --prune "+refs/heads/*:refs/remotes/origin/*"

      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: release-assets

      # Before tagging, so the ranges are right. Every release belongs to an Enhanced tag, so Enhanced
      # lists what is new since its previous tag. Legacy has no release of its own, so it lists what is new
      # since the legacy version the previous release shipped. That is nothing when legacy did not move.
      - name: Generate changelogs
        shell: bash
        run: |
          range_for() {
            local glob="$1" ref="$2" prev
            prev=$(git tag --list "$glob" --sort=-version:refname --no-contains "$ref" | head -n 1)
            echo "$glob range starts at: ${prev:-<none, full history>}" >&2
            if [ -n "$prev" ]; then echo "$prev..$ref"; else echo "$ref"; fi
          }

          changelog() {
            : > "$2"
            if [ -n "$1" ]; then
              git log "$1" --pretty=format:'- `%h` (%an) %s' > "$2"
            fi
            cat "$2"
            echo ""
          }

          breaking() {
            local range="$1" out="$2" sha subject note
            : > "$out"
            [ -n "$range" ] || return 0
            for sha in $(git log "$range" --format='%H'); do
              subject=$(git log -1 "$sha" --format='%s')
              note=$(git log -1 "$sha" --format='%b' \
                | awk '/^BREAKING[ -]CHANGE:/ { flag = 1; sub(/^BREAKING[ -]CHANGE:[[:space:]]*/, "") } flag' \
                | paste -sd ' ' - \
                | sed 's/[[:space:]]*$//')
              if [ -z "$note" ] && ! echo "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
                continue
              fi
              echo "- \`$(git log -1 "$sha" --format='%h')\` $subject" >> "$out"
              if [ -n "$note" ]; then
                echo "  $note" >> "$out"
              fi
            done
          }

          TAG="enhanced-v$ENHANCED_VERSION"
          PREVIOUS_TITLE=$(gh release list --exclude-drafts --limit 50 --json tagName,name,createdAt \
            --jq "sort_by(.createdAt) | reverse | map(select(.tagName != \"$TAG\")) | .[0].name // \"\"")
          PREVIOUS_LEGACY=$(printf '%s' "$PREVIOUS_TITLE" | sed -nE 's/.* and v([0-9][^ ]*) \(Legacy\)$/\1/p')
          echo "Previous release: ${PREVIOUS_TITLE:-<none>}, shipping legacy ${PREVIOUS_LEGACY:-<unknown>}" >&2

          if [ "$PREVIOUS_LEGACY" = "$LEGACY_VERSION" ]; then
            LEGACY_RANGE=""
          elif [ -n "$PREVIOUS_LEGACY" ] && git rev-parse -q --verify "refs/tags/v$PREVIOUS_LEGACY" >/dev/null; then
            LEGACY_RANGE="v$PREVIOUS_LEGACY..$LEGACY_REF"
          else
            LEGACY_RANGE=$(range_for 'v[0-9]*' "$LEGACY_REF")
          fi
          ENHANCED_RANGE=$(range_for 'enhanced-v[0-9]*' "$ENHANCED_REF")

          changelog "$LEGACY_RANGE"   changelog-legacy.txt
          changelog "$ENHANCED_RANGE" changelog-enhanced.txt

          breaking "$LEGACY_RANGE"   breaking-legacy.txt
          breaking "$ENHANCED_RANGE" breaking-enhanced.txt

      - name: Create and push tags
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}"

          tag_line() {
            local tag="$1" ref="$2"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists, skipping."
            else
              git tag "$tag" "$ref"
              git push origin "$tag"
              echo "Pushed tag $tag."
            fi
          }

          tag_line "v$LEGACY_VERSION"            "$LEGACY_REF"
          tag_line "enhanced-v$ENHANCED_VERSION" "$ENHANCED_REF"

      # A legacy only push keeps the Enhanced version, so its release already exists and is updated in place.
      - name: Create or update the release
        id: release
        shell: bash
        run: |
          TAG="enhanced-v$ENHANCED_VERSION"
          TITLE="MenuAPI v$ENHANCED_VERSION (Enhanced) and v$LEGACY_VERSION (Legacy)"

          {
            if [ -s breaking-enhanced.txt ] || [ -s breaking-legacy.txt ]; then
              echo "> [!WARNING]"
              echo "> **This release contains breaking changes.** Read these before updating."

              if [ -s breaking-enhanced.txt ]; then
                echo ">"
                echo "> **Enhanced v$ENHANCED_VERSION**"
                echo ">"
                sed 's/^/> /' breaking-enhanced.txt
              fi

              if [ -s breaking-legacy.txt ]; then
                echo ">"
                echo "> **Legacy v$LEGACY_VERSION**"
                echo ">"
                sed 's/^/> /' breaking-legacy.txt
              fi

              echo ""
            fi

            echo "One release, both versions of MenuAPI."
            echo ""
            echo "| Version | For | Download |"
            echo "| --- | --- | --- |"
            echo "| **v$ENHANCED_VERSION** | FiveM Enhanced | \`MenuAPI-$ENHANCED_VERSION-FiveM-Enhanced.zip\` |"
            echo "| **v$LEGACY_VERSION** | FiveM (legacy runtime) | \`MenuAPI-$LEGACY_VERSION-FiveM.zip\` |"
            echo "| **v$LEGACY_VERSION** | RedM | \`MenuAPI-$LEGACY_VERSION-RedM.zip\` |"
            echo ""
            echo "## Changes in Enhanced v$ENHANCED_VERSION"
            cat changelog-enhanced.txt
            echo ""
            echo ""
            echo "## Changes in Legacy v$LEGACY_VERSION"
            if [ -s changelog-legacy.txt ]; then
              cat changelog-legacy.txt
            else
              echo "No changes since the previous release, this is still Legacy v$LEGACY_VERSION."
            fi
            echo ""
            echo ""
            echo "## Notes"
            echo "The NativeHooks zip is a profiling build of Enhanced, packed as a NuGet package you can install from a local folder feed. It wraps every native call in a profiler scope, so it is slower than the normal build and is not published to nuget.org. You do not need it unless you are profiling."
            echo ""
            echo "Docs: [Enhanced](https://docs.vespura.com/menuapi/enhanced), [Legacy and RedM](https://docs.vespura.com/mapi)."
          } > release_notes.md

          ASSETS=(
            "release-assets/MenuAPI-$ENHANCED_VERSION-FiveM-Enhanced.zip"
            "release-assets/MenuAPI-$ENHANCED_VERSION-NativeHooks-NuGet.zip"
            "release-assets/MenuAPI-$LEGACY_VERSION-FiveM.zip"
            "release-assets/MenuAPI-$LEGACY_VERSION-RedM.zip"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating it."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber

            # Asset names carry the version, so the previous zips of the line that moved are left behind otherwise.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r NAME; do
              KEEP=false
              for ASSET in "${ASSETS[@]}"; do
                if [ "$NAME" = "$(basename "$ASSET")" ]; then KEEP=true; fi
              done
              if [ "$KEEP" = "false" ]; then
                echo "Removing stale asset $NAME."
                gh release delete-asset "$TAG" "$NAME" --yes
              fi
            done
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file release_notes.md "${ASSETS[@]}"
          fi

          RELEASE_URL=$(gh release view "$TAG" --json url --jq .url)
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Release"
            echo ""
            echo "[$TITLE]($RELEASE_URL) on tag \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Only the line that got a new version is pushed. NativeHooks is never in this list, so it cannot reach nuget.org.
  publish-nuget:
    name: Publish NuGet packages
    needs: [plan, release]
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuget-*
          merge-multiple: true
          path: packages

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push Enhanced
        if: needs.plan.outputs.enhanced_moved == 'true'
        shell: bash
        run: |
          dotnet nuget push packages/MenuAPI.FiveM.Enhanced.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Push Legacy
        if: needs.plan.outputs.legacy_moved == 'true'
        shell: bash
        run: |
          for package in packages/MenuAPI.FiveM.[0-9]*.nupkg packages/MenuAPI.RedM.*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

  notify:
    name: Discord Notification
    needs: [plan, build-legacy-fivem, build-legacy-redm, build-enhanced, release, publish-nuget]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          LEGACY_FIVEM_RESULT: ${{ needs.build-legacy-fivem.result }}
          LEGACY_REDM_RESULT: ${{ needs.build-legacy-redm.result }}
          ENHANCED_RESULT: ${{ needs.build-enhanced.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          NUGET_RESULT: ${{ needs.publish-nuget.result }}
          LEGACY_VERSION: ${{ needs.plan.outputs.legacy_version }}
          ENHANCED_VERSION: ${{ needs.plan.outputs.enhanced_version }}
          RELEASE: ${{ needs.plan.outputs.release }}
          PLAN_RESULT: ${{ needs.plan.result }}
          LEGACY_MOVED: ${{ needs.plan.outputs.legacy_moved }}
          ENHANCED_MOVED: ${{ needs.plan.outputs.enhanced_moved }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured, skipping."
            exit 0
          fi

          icon() {
            case "$1" in
              success)   echo "✅" ;;
              cancelled) echo "⚠️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❌" ;;
            esac
          }

          line() {
            local result="$1" version="$2" moved="$3" state
            if [ "$moved" = "true" ]; then state="new"; else state="unchanged"; fi
            echo "$(icon "$result") v${version:-?} ($state)"
          }

          worst() {
            local r
            for r in "$@"; do
              case "$r" in success|skipped) ;; *) echo "$r"; return ;; esac
            done
            echo "$1"
          }

          LEGACY_RESULT=$(worst "$LEGACY_FIVEM_RESULT" "$LEGACY_REDM_RESULT")

          if [ "$RELEASE" != "true" ]; then
            PUBLISHED="nothing new"
          elif [ "$ENHANCED_MOVED" = "true" ] && [ "$LEGACY_MOVED" = "true" ]; then
            PUBLISHED="Enhanced and Legacy"
          elif [ "$ENHANCED_MOVED" = "true" ]; then
            PUBLISHED="Enhanced"
          else
            PUBLISHED="Legacy"
          fi
          NUGET_TEXT="$(icon "$NUGET_RESULT") $NUGET_RESULT ($PUBLISHED)"

          FAILED=false
          CANCELLED=false
          for RESULT in "$PLAN_RESULT" "$LEGACY_FIVEM_RESULT" "$LEGACY_REDM_RESULT" "$ENHANCED_RESULT" "$RELEASE_RESULT" "$NUGET_RESULT"; do
            case "$RESULT" in
              cancelled) CANCELLED=true ;;
              success|skipped) ;;
              *) FAILED=true ;;
            esac
          done

          if [ "$RELEASE" != "true" ] && [ "$FAILED" = "false" ] && [ "$CANCELLED" = "false" ]; then
            COLOR=9807270
            STATUS_TEXT="No new version, nothing was released."
          elif [ "$CANCELLED" = "true" ]; then
            COLOR=16776960
            STATUS_TEXT="Build cancelled."
          elif [ "$FAILED" = "true" ]; then
            COLOR=13632027
            STATUS_TEXT="Build FAILED!"
          else
            COLOR=4502298
            STATUS_TEXT="Build passed!"
          fi

          if [ -n "$RELEASE_URL" ] && [ "$RELEASE_RESULT" = "success" ]; then
            LINK_NAME="GitHub Release"
            LINK_URL="$RELEASE_URL"
          else
            LINK_NAME="Build Run"
            LINK_URL="$RUN_URL"
          fi

          SHA="${{ github.sha }}"

          # Discord rejects field values over 1024 characters, squash merges easily get there.
          COMMIT_SUBJECT=$(printf '%s' "${COMMIT_MSG:-Manual run}" | head -n 1)
          if [ "${#COMMIT_SUBJECT}" -gt 256 ]; then
            COMMIT_SUBJECT="${COMMIT_SUBJECT:0:253}..."
          fi

          PAYLOAD=$(jq -n \
            --arg  title      "MenuAPI (Enhanced v${ENHANCED_VERSION:-?}, Legacy v${LEGACY_VERSION:-?})" \
            --arg  desc       "$STATUS_TEXT" \
            --argjson color   "$COLOR" \
            --arg  actor      "${{ github.actor }}" \
            --arg  actor_url  "https://github.com/${{ github.actor }}" \
            --arg  enhanced   "$(line "$ENHANCED_RESULT" "$ENHANCED_VERSION" "$ENHANCED_MOVED")" \
            --arg  legacy     "$(line "$LEGACY_RESULT" "$LEGACY_VERSION" "$LEGACY_MOVED")" \
            --arg  nuget      "$NUGET_TEXT" \
            --arg  branch     "${{ github.ref_name }}" \
            --arg  link_name  "$LINK_NAME" \
            --arg  link_url   "$LINK_URL" \
            --arg  short_sha  "${SHA:0:7}" \
            --arg  commit_url "https://github.com/${{ github.repository }}/commit/$SHA" \
            --arg  commit_msg "$COMMIT_SUBJECT" \
            '{
              embeds: [{
                title:       $title,
                description: $desc,
                color:       $color,
                author: { name: ("Committed by " + $actor), url: $actor_url },
                fields: [
                  { name: "MenuAPI Enhanced",              value: $enhanced, inline: true },
                  { name: "MenuAPI Legacy (FiveM + RedM)", value: $legacy,   inline: true },
                  { name: "NuGet",                         value: $nuget,    inline: true },
                  { name: "Branch",                        value: $branch,   inline: true },
                  { name: $link_name,                      value: ("[Link](" + $link_url + ")"), inline: true },
                  { name: "Commit",                        value: ("[`" + $short_sha + "`](" + $commit_url + ") " + $commit_msg), inline: false }
                ]
              }]
            }')

          curl -fsSL -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
