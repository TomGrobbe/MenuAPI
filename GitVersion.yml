# GitVersion configuration (FiveM Enhanced branch)
# Docs: https://gitversion.net/docs/reference/configuration
#
# The Enhanced branch publishes auto-incrementing alpha pre-releases in the
# format 0.0.1-alpha.1, 0.0.1-alpha.2, ... (the trailing number increments as
# commits are added). Release tags are prefixed `enhanced-v` so they stay
# separate from the legacy `v` tags on master. Bump major/minor/patch with a
# commit-message trailer anywhere in the message:
#   +semver: major | minor | patch | none

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
mode: ContinuousDelivery
tag-prefix: 'enhanced-v'
next-version: 0.0.1

branches:
  fivem-enhanced:
    regex: '^fivem-enhanced$'
    tag: alpha
    increment: Patch
    source-branches: []
    is-mainline: false
